name: mirror

# Odoo.sh and Cloudpepper attach a branch named after the Odoo version. The
# module is one code base for 19 and 20: work lands on `19.0` (the default
# branch) and every push there lands on `20.0` too. Nobody commits to 20.0.

on:
  push:
    branches: ['19.0']

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git push --force origin HEAD:refs/heads/20.0
