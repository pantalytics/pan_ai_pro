name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.15.10,<0.16"
      - run: ruff format --check --diff .
      - run: ruff check . --output-format=github
      - run: python scripts/checks/no_em_dash.py
      - run: python scripts/checks/loc_budget.py
      - run: python scripts/checks/license_header.py

  tests:
    name: Odoo ${{ matrix.odoo }} install and tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        odoo: ['19', '20']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    container:
      image: odoo:${{ matrix.odoo }}
      options: --user root
    steps:
      - uses: actions/checkout@v6
      # The image runs Odoo from Debian's packages. A venv over them, like Cloudpepper's,
      # takes the module's requirements without touching Debian's files; playwright gets a
      # venv of its own so its greenlet never shadows the one Debian's gevent was built against.
      # Odoo runs as `python /usr/bin/odoo`, not `python -m odoo`: the gevent worker is spawned
      # by re-running argv[0], and a package's __main__.py cannot be re-run as a script.
      - name: Install the module's Python dependencies (what Odoo.sh and Cloudpepper do on pull)
        run: |
          python3 -m venv --without-pip --system-site-packages /opt/venv
          /opt/venv/bin/python -m pip install -r pan_ai_pro/requirements.txt requests
          python3 -m venv --without-pip --system-site-packages /opt/pw
          /opt/pw/bin/python -m pip install playwright==1.56.0
      - name: Install and run the unit tests
        run: |
          /opt/venv/bin/python /usr/bin/odoo -d ci --db_host=postgres --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            -i pan_ai_pro --test-enable --test-tags /pan_ai_pro --stop-after-init --without-demo=all \
            --log-level=test 2>&1 | tee odoo-tests.log
          grep -qE "0 failed, 0 error\(s\)" odoo-tests.log
      - name: Browser check against a real server and the stubs
        run: |
          /opt/pw/bin/python -m playwright install --with-deps chromium
          python3 scripts/browser/fake_platform.py 8090 /tmp/pub & sleep 1
          python3 scripts/browser/fake_openrouter.py 8091 & sleep 1
          PAN_AI_PRO_SERVER_URL=http://127.0.0.1:8090 PAN_AI_PRO_PUBLIC_KEY="$(cat /tmp/pub)" \
          PAN_AI_PRO_OPENROUTER_BASE_URL=http://127.0.0.1:8091/v1 \
          /opt/venv/bin/python /usr/bin/odoo -d ci --db_host=postgres --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            --db-filter=^ci$ --workers=2 --max-cron-threads=1 --limit-time-real=30 --limit-time-real-cron=75 \
            --http-port=8069 --gevent-port=8072 --proxy-mode > odoo-server.log 2>&1 &
          python3 scripts/browser/proxy.py 8080 & sleep 10
          python3 - <<'PY'
          import xmlrpc.client
          c = xmlrpc.client.ServerProxy("http://127.0.0.1:8080/xmlrpc/2/common"); uid = c.authenticate("ci", "admin", "admin", {})
          o = xmlrpc.client.ServerProxy("http://127.0.0.1:8080/xmlrpc/2/object")
          print(o.execute_kw("ci", uid, "admin", "pan_ai.license", "accept_key", ["mp_fake_" + "a" * 40]))
          # a record write: 19 has set_param, 20 has set_str, both have write
          ids = o.execute_kw("ci", uid, "admin", "ir.config_parameter", "search", [[["key", "=", "pan_ai.openrouter_key"]]])
          o.execute_kw("ci", uid, "admin", "ir.config_parameter", "write", [ids, {"value": "sk-or-ci"}]) if ids else o.execute_kw("ci", uid, "admin", "ir.config_parameter", "create", [{"key": "pan_ai.openrouter_key", "value": "sk-or-ci"}])
          PY
          /opt/pw/bin/python scripts/browser/check_chat.py http://127.0.0.1:8080 admin admin "How many contacts are there?" | tee browser.json
          python3 - <<'PY'
          import json; d = json.load(open("browser.json"))
          m = d["metrics"]; assert not d["js_errors"], d["js_errors"]
          assert m["first_delta_latency_ms"] is not None and m["first_delta_latency_ms"] < 300, m
          assert m["max_batch_latency_ms"] < 500, m
          PY
      - name: The server's log when the browser check failed
        if: failure()
        run: tail -n 150 odoo-server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-odoo-${{ matrix.odoo }}
          path: |
            scripts/browser/shot_*.png
            browser.json
            odoo-server.log
            odoo-tests.log
            odoo-server.log

  # Odoo.sh and Cloudpepper attach a branch named after the Odoo version, and
  # the module is one code base for 19 and 20. So a merge into main is a
  # release: once lint and both test runs are green, main is merged into
  # 19.0 and 20.0 is set to match. Nobody commits to 19.0 or 20.0. A push
  # made with the workflow's own token starts no second run, so this cannot
  # loop.
  release:
    name: main lands on 19.0 and 20.0
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-branches
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 19.0
          git checkout -B 19.0 origin/19.0
          # A fast-forward when 19.0 is behind, a merge commit when it carries
          # the merge commits of the releases made by hand before this job.
          git merge --no-edit origin/main
          git push origin 19.0
          git push --force origin 19.0:refs/heads/20.0
